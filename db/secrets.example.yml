# ─────────────────────────────────────────────────────────────
# LYCEE.SIN — modèle du fichier de secrets PRIVÉ
#
# Copie-le en `db/secrets.yml` (gitignoré) et écris tes secrets dedans :
#
#     cp db/secrets.example.yml db/secrets.yml
#     pnpm secrets:import -- --file db/secrets.yml --dry-run
#     pnpm secrets:import -- --file db/secrets.yml
#
# Pourquoi un fichier à part et ignoré par git : le dépôt est public, et
# `db/seeds/secrets.ts` a publié la feuille de réponses de la chasse avec le
# jeu. Les secrets déjà sortis y restent — on ne dépublie pas — mais les
# nouveaux passent par ici et ne quittent jamais le serveur.
#
# Les cinq secrets ci-dessous sont de vrais secrets DÉJÀ PUBLIÉS : ils ne
# révèlent rien de plus et servent de modèle.
# ─────────────────────────────────────────────────────────────

secrets:
  # Le plus simple : cinq champs, les points viennent de la difficulté
  # (facile 10 · moyen 20 · difficile 30 · démentiel 50).
  - code: SIN-404
    name: "Perdu mais pas pour tout le monde"
    hint: "Que se passe-t-il si tu demandes une page qui n'existe pas ?"
    category: WEB
    difficulty: easy

  # `points` n'est là que pour déroger au barème — évite-le sans raison.
  - code: SIN-KONAMI
    name: "La combinaison que les vieux joueurs connaissent par cœur"
    hint: "Haut, haut, bas, bas… Essaie-la sur la page d'accueil."
    category: EASTER-EGG
    difficulty: hard
    points: 30

  # Un nom qui décrit sans nommer : c'est la règle, et l'import la fait
  # respecter. « Langage de programmation serpent » passe ; « Le langage
  # Python » serait refusé, parce qu'il n'y aurait plus rien à chercher.
  - code: PYTHON
    name: "Langage de programmation serpent"
    hint: "Guido van Rossum l'a écrit pendant les vacances de Noël 1989."
    category: PROGRAMMING
    difficulty: easy

  - code: KEVIN-MITNICK
    name: "Le hacker le plus recherché des années 90, devenu consultant"
    hint: "Il répétait que le maillon faible n'est pas la machine mais la personne devant."
    category: HACKING-HISTORY
    difficulty: medium

  # Plusieurs réponses acceptées pour un seul secret. C'est ce qui manquait le
  # 2026-09-07 : des élèves donnaient une réponse juste et non prévue, le jeu
  # la refusait, et il a fallu créer des doublons en plein cours.
  - code: RICKROLL
    name: "La chanson de 1987 qui piège encore les liens en 2026"
    hint: "Tu cliques sur autre chose, et c'est elle qui démarre."
    category: INTERNET-CULTURE
    difficulty: easy
    aliases: [NEVER-GONNA-GIVE, NEVER-GONNA-GIVE-YOU-UP]
