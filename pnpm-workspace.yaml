# pnpm 11 blocks dependency build scripts unless they are allow-listed here.
# Both are needed by the Next build itself:
#   esbuild — bundling
#   sharp   — image optimisation
# Without this, `pnpm build` fails with ERR_PNPM_IGNORED_BUILDS, and because
# the Dockerfile runs `pnpm build`, the image build fails identically.
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: false

# pnpm 11 no longer reads the "pnpm.overrides" field in package.json (it is
# silently ignored, with only a install-time warning to notice it by). The
# override pins below moved here, which is the pnpm 11 home for them.
# They force @types/react and @types/react-dom to match the pinned react
# and react-dom versions, since some transitive deps request "*".
overrides:
  '@types/react': 19.2.7
  '@types/react-dom': 19.2.3

# Security floors for transitive deps, not pins: each one only raises the
# minimum inside the major its parents already ask for. Dependabot flagged
# them on 2026-10-03, and `pnpm update --depth Infinity` did not move them.
# All of them run at build or lint time (Next's Babel chain, Tailwind,
# eslint), none in the request path. Drop a line once `pnpm why <pkg>` shows
# every copy above the floor without it.
# `braces` is absent on purpose: the advisory's fix (>= 3.0.4) is not
# published, 3.0.3 is still the latest release.
  'picomatch@^4': ^4.0.4
  browserslist: ^4.28.7
  baseline-browser-mapping: ^2.11.0
  'brace-expansion@^5': ^5.0.12
